[supervisord]
nodaemon=true
logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/supervisord.log
logfile_maxbytes=0

[program:dbus]
priority=10
autostart=true
autorestart=true
directory=/
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-dbus.sh
environment=HOME="%(ENV_CLOUDYPAD_USER_HOME)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/dbus.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/dbus.err.log

[program:udev]
priority=10
autostart=true
autorestart=true
user=root
command=/cloudy/bin/start-udev.sh
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/udev.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/udev.err.log

[program:seatd]
priority=10
autostart=true
autorestart=true
user=root
command=/cloudy/bin/start-seatd.sh
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/seatd.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/seatd.err.log

[program:dbus-session]
priority=15
autostart=true
autorestart=true
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-dbus-session.sh
environment=HOME="%(ENV_CLOUDYPAD_USER_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/dbus-session.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/dbus-session.err.log

[program:pipewire]
priority=20
autostart=true
autorestart=true
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-pipewire.sh
environment=HOME="%(ENV_CLOUDYPAD_USER_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/pipewire.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/pipewire.err.log

[program:pipewire-pulse]
priority=20
autostart=true
autorestart=true
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-pipewire-pulse.sh
environment=HOME="%(ENV_CLOUDYPAD_USER_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/pipewire-pulse.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/pipewire-pulse.err.log

[program:wireplumber]
priority=25
autostart=true
autorestart=true
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-wireplumber.sh
environment=HOME="%(ENV_CLOUDYPAD_USER_HOME)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/wireplumber.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/wireplumber.err.log

[program:hyprland]
priority=30
autostart=true
autorestart=true
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-hyprland.sh
environment=
    HOME="%(ENV_CLOUDYPAD_USER_HOME)s",
    USER="%(ENV_CLOUDYPAD_USER)s",
    WAYLAND_DISPLAY="%(ENV_WAYLAND_DISPLAY)s",
    DISPLAY="%(ENV_DISPLAY)s",
    XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",
    XDG_DATA_HOME="%(ENV_XDG_DATA_HOME)s",
    XDG_CACHE_HOME="%(ENV_XDG_CACHE_HOME)s",
    XDG_CONFIG_HOME="%(ENV_XDG_CONFIG_HOME)s"
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/hyprland.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/hyprland.err.log

[program:sunshine]
priority=40
autostart=true
autorestart=true
user=%(ENV_CLOUDYPAD_USER)s
command=/cloudy/bin/start-sunshine.sh
environment=
    HOME="%(ENV_CLOUDYPAD_USER_HOME)s",
    USER="%(ENV_CLOUDYPAD_USER)s",
    WAYLAND_DISPLAY="%(ENV_WAYLAND_DISPLAY)s",
    DISPLAY="%(ENV_DISPLAY)s",
    XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",
    CLOUDYPAD_DATA_DIR="%(ENV_CLOUDYPAD_DATA_DIR)s"
stopsignal=TERM
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/sunshine.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/sunshine.err.log

[program:setup-container-post-start]
priority=99
autostart=true
autorestart=false
startsecs=0
exitcodes=0
user=root
command=/cloudy/bin/setup-container-post-start.sh
environment=
    XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",
    XDG_DATA_HOME="%(ENV_XDG_DATA_HOME)s",
    XDG_CACHE_HOME="%(ENV_XDG_CACHE_HOME)s",
    XDG_CONFIG_HOME="%(ENV_XDG_CONFIG_HOME)s"
stdout_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/setup-container-post-start.log
stderr_logfile=%(ENV_CLOUDYPAD_LOG_DIR)s/setup-container-post-start.err.log
