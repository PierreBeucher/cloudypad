#
# Nvidia dummy display
# This file is generated from a template to extrapolate some environment variables
# If you edit it manually it will be overwritten on next restart
#

Section "ServerLayout"
    Identifier "TwinLayout"
    Screen 0 "metaScreen" 0 0
EndSection

Section "Monitor"
    Identifier "Monitor0"
    Option "Enable" "true"
EndSection

Section "Device"
    Identifier "Card1"
    BusID  "PCI:${NVIDIA_PCI_BUS_ID}"  # Azure needs 0@1:0:0 for 00000001:00:00.0
    Driver "nvidia"
    VendorName "NVIDIA Corporation"
    Option "MetaModes" "1920x1080"
    Option "ConnectedMonitor" "DP-0"
    # Declare the fake display as a real 1920x1080 panel: without an EDID,
    # desktop environments auto-configure the unknown display at session start
    # and issue a fallback-resolution mode change (1024x768 nvidia-auto-select)
    # which wedges the NVIDIA display engine on some virtualized GPUs (observed
    # on Linode g2-gpu-rtx4000a1: Xid 56, "Failed to request fliplock", display
    # channel never idles, Xorg spins at 100% CPU until reboot). With an EDID
    # present, no component reconfigures the display and the engine stays
    # healthy. The blob is a standard DMT 1920x1080@60 EDID.
    Option "CustomEDID" "DP-0:/cloudy/conf/x11/edid/1920x1080.bin"
    Option "ModeValidation" "NoDFPNativeResolutionCheck,NoVirtualSizeCheck,NoMaxPClkCheck,NoHorizSyncCheck,NoVertRefreshCheck,NoWidthAlignmentCheck"
EndSection

Section "Screen"
    Identifier "metaScreen"
    Device "Card1"
    Monitor "Monitor0"
    DefaultDepth 24
    Option "TwinView" "True"
    SubSection "Display"
        Modes "1920x1080"
    EndSubSection
EndSection