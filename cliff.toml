# git-cliff configuration used by hack/release-create.sh to generate the
# CHANGELOG.md section (and GitHub release notes) of a new release.
# See https://git-cliff.org/docs/configuration
#
# Only the unreleased section is generated (--unreleased --tag vX.Y.Z) and
# inserted below the "# Changelog" title: existing history is never regenerated.

[changelog]
header = ""
# Date is generation date: only used for the release being created
body = """
## [{{ version | trim_start_matches(pat="v") }}]\
{% if previous.version %}(https://github.com/PierreBeucher/cloudypad/compare/{{ previous.version }}...{{ version }}){% endif %} \
({{ now() | date(format="%Y-%m-%d") }})
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
* {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/PierreBeucher/cloudypad/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Drop non-conventional commits (merges, "sunshine: ...", "wip: ...", etc.)
filter_unconventional = true
# Drop conventional commits not matched by a parser below (chore, dev, docs, test, refactor...)
filter_commits = true
split_commits = false
protect_breaking_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
]

[bump]
# 0.x semantics: feat bumps minor, breaking change does not bump major
features_always_bump_minor = true
breaking_always_bump_major = false
