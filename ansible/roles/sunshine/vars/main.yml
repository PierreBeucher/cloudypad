# Known NVIDIA professional (workstation) GPU models supporting NvFBC capture
# Name matches return value for nvidia-smi --query-gpu=gpu_name
#
# GPUs with display outputs: Sunshine uses NvFBC capture, no resolution cap.
# On these GPUs the default x11 capture combined with ForceFullCompositionPipeline
# (applied on session start) freezes fullscreen games: frames never complete
# while the composition pipeline is forced (observed on Linode RTX 4000 Ada).
# Only list models validated on a real instance.
nvidia_professional_gpu_models:
  - NVIDIA RTX 4000 Ada Generation
