# Known NVIDIA datacenter GPU models
# Name matches return value for nvidia-smi --query-gpu=gpu_name
#
# Headless GPUs (no display output): Sunshine uses NvFBC capture and
# screen resolution is capped to 2560x1600 (see docker-compose.nvidia.yml)
#
# Generated using a mix of real nvidia-smi outputs from various providers, ChatGPT and 
# https://en.wikipedia.org/wiki/List_of_Nvidia_graphics_processing_units#Tesla
# so may not be completely accurate. Feel free to provide PR to fix / improve it!
#
nvidia_datacenter_gpu_models:
