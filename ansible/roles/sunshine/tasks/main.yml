# ---
- name: Ensure Sunshine project directory exists
  file:
    path: "{{ sunshine_project_dir }}"
    state: directory
    mode: '0750'

- name: Ensure Sunshine data directory exists
  become: true # required since container user may not match host user. TODO fix this
  file:
    path: "{{ sunshine_data_dir }}"
    state: directory
    mode: '0750'

- name: Ensure Sunshine persistent config directory exists
  become: true # required since container user may not match host user. TODO fix this
  file:
    path: "{{ sunshine_persistent_config_dir }}"
    state: directory
    mode: '0750'

- name: import legacy data move tasks
  import_tasks: legacy-data.yml
  tags: [ legacy-data ]

- name: import Nvidia tasks
  # nvidia.yml detects driver version, PCI bus ID etc. needed to render
  # docker-compose.nvidia.yml: also tagged sunshine-nvidia so the compose
  # deployment (tag sunshine-docker) can pull these detection tasks without
  # the heavy nvidia-driver role (driver reinstall, reboot...)
  import_tasks: nvidia.yml
  when: sunshine_nvidia_enable
  tags: [ nvidia, sunshine-nvidia ]

- name: Ensure vkms virtual GPU module is loaded at boot
  # Software rendering fallback for GPU-less environments (eg. dev VMs):
  # Sunshine wlr capture requires the compositor to expose linux-dmabuf,
  # which needs a GBM-backed renderer on a DRM device. vkms provides a
  # virtual card supporting GBM buffer allocation, which Mesa can drive
  # with llvmpipe (see containers/sunshine/overlay/cloudy/bin/start-labwc.sh)
  become: true
  copy:
    content: "vkms"
    dest: /etc/modules-load.d/vkms.conf
    mode: '0644'
  register: vkms_modules_load_config
  when: sunshine_software_rendering_vgem | default(false)

- name: Load vkms module now
  become: true
  ansible.builtin.modprobe:
    name: vkms
    state: present
  when:
    - sunshine_software_rendering_vgem | default(false)
    - vkms_modules_load_config is changed

- name: Copy Sunshine readiness check script
  become: true
  copy:
    src: cloudypad-check-readiness.sh
    dest: "/usr/local/bin/cloudypad-check-readiness"
    mode: '0755'

# List of Compose files to use depending on GPU used
- name: Set Docker Compose files
  tags: [ sunshine-docker ]
  set_fact:
    sunshine_compose_files: "{{ 
      ['docker-compose.yml'] 
      + (['docker-compose.nvidia.yml'] if sunshine_nvidia_enable else []) 
    }}"

- name: Copy Docker Compose files
  tags: [ sunshine-docker ]
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ sunshine_project_dir }}/{{ item }}"
    mode: '0644'
  loop: "{{ sunshine_compose_files }}"

- name: Deploy Sunshine container
  tags: [ sunshine-docker ]
  community.docker.docker_compose_v2:
    project_src: "{{ sunshine_project_dir }}"
    build: always
    state: present
    files: "{{ sunshine_compose_files }}"
    pull: "{{ sunshine_compose_pull_images }}"
    remove_orphans: true
