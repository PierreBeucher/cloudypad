---
# Some Cloud providers are missing important modules (like drm) on their kernels
# (as headless servers normally don't need them)
# Installing them to avoid driver install issue
- name: Install linux-modules-extra package
  become: true
  apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present
    update_cache: true

- name: unload nouveau
  modprobe:
    name: nouveau
    state: absent
  ignore_errors: true

# Remove apt packages in favor of .run file
# Using .run file provides better reproducibility as we're certain about version installed
- name: remove unused nvidia-*-server driver packages
  apt:
    name: "{{ nvidia_driver_package_version | ternary(item + '=' + nvidia_driver_package_version, item) }}"
    state: 'absent'
    autoremove: true
    purge: true
  loop:
    - "nvidia-headless-{{ nvidia_driver_ubuntu_branch }}{{ nvidia_driver_ubuntu_packages_suffix }}"
    - "nvidia-utils-{{ nvidia_driver_ubuntu_branch }}{{ nvidia_driver_ubuntu_packages_suffix }}"
    - "nvidia-headless-no-dkms-{{ nvidia_driver_ubuntu_branch }}{{ nvidia_driver_ubuntu_packages_suffix }}"
    - "nvidia-kernel-source-{{ nvidia_driver_ubuntu_branch }}{{ nvidia_driver_ubuntu_packages_suffix }}"
  register: install_driver
  environment: "{{proxy_env if proxy_env is defined else {}}}"

- name: remove Ubuntu graphics ppa
  apt_repository:
    repo: ppa:graphics-drivers/ppa
    state: absent
    update_cache: true

- name: reboot after old driver package removal
  reboot:
    post_reboot_delay: 10
  when: not nvidia_driver_skip_docker_restart

# required on some system to create /dev/nvidia-caps* automatically, see https://docs.nvidia.com/cuda/cuda-installation-guide-linux/index.html#device-node-verification
- name: install nvidia-modprobe 
  apt:
    name: nvidia-modprobe
    update_cache: true

- name: install NVIDIA drivers
  import_tasks: driver.yml
  tags: [ driver ]

- name: Set module parameters
  register: nvidia_driver_module_file_result
  template:
    src: nvidia.conf.j2
    dest: "{{ nvidia_driver_module_file }}"
    mode: '0644'

- name: Update initramfs after module parameters update
  command: update-initramfs -u
  when: nvidia_driver_module_file_result.changed

# --- nvidia_drm module load and hold ---
# On headless NVIDIA GPUs (datacenter, eg. Linode RTX 4000 Ada), the nvidia_drm
# module is not loaded at boot (nothing triggers it on a headless host) and
# tears itself down shortly after load when the last client closes the card
# device ("Cannot find any crtc or sizes" then driver unload), making
# /dev/dri/cardN disappear. Cloudy Pad's compositor (labwc DRM/GBM renderer)
# and Sunshine capture need the nvidia DRM card to exist and stay available.
# - modules-load.d: load nvidia_drm at boot (modprobe resolves nvidia core deps)
# - modprobe.d: modeset=1 is required for the DRM device to be usable by wlroots
# - nvidia-drm-hold service: holds the card device open so the module stays
#   loaded (prevents last-close teardown)

- name: Ensure nvidia_drm is loaded at boot
  become: true
  copy:
    content: "nvidia_drm"
    dest: /etc/modules-load.d/nvidia-drm.conf
    mode: '0644'

- name: Ensure nvidia_drm modeset option is set
  become: true
  copy:
    content: "options nvidia-drm modeset=1"
    dest: /etc/modprobe.d/nvidia-drm-modeset.conf
    mode: '0644'

- name: Ensure nvidia-drm-hold script exists
  become: true
  register: nvidia_drm_hold_script
  copy:
    dest: /usr/local/bin/nvidia-drm-hold.sh
    mode: '0755'
    src: files/nvidia-drm-hold.sh

- name: Ensure nvidia-drm-hold service exists
  become: true
  register: nvidia_drm_hold_systemd_unit
  copy:
    dest: /etc/systemd/system/nvidia-drm-hold.service
    mode: '0644'
    src: files/nvidia-drm-hold.service

- name: Reload systemd for nvidia-drm-hold
  ansible.builtin.command: systemctl daemon-reload
  when: nvidia_drm_hold_systemd_unit.changed or nvidia_drm_hold_script.changed

- name: Enable nvidia-drm-hold service
  ansible.builtin.systemd_service:
    name: nvidia-drm-hold
    enabled: true
    state: started

# Load nvidia_drm right away when possible (fresh install without reboot):
# ignore failure as the module may require a reboot to be loadable
- name: Load nvidia_drm module now
  ansible.builtin.modprobe:
    name: nvidia_drm
    state: present
  ignore_errors: true

# Setup a service running in userspace to ensure /dev/nvidia-caps/* devices are present on boot
# See https://docs.nvidia.com/datacenter/tesla/mig-user-guide/index.html#device-nodes-devfs
- name: Ensure nvidia-caps startup script exists
  register: nvidia_dev_script
  copy:
    dest: /usr/local/bin/nvidia-setup-devices.sh
    mode: '0755'
    src: files/nvidia-setup-devices.sh

- name: Ensure nvidia-caps systemd script exists
  register: nvidia_dev_systemd_unit
  copy:
    dest: /etc/systemd/system/nvidia-setup-devices.service
    content: |
      [Unit]
      Description=Setup NVIDIA devices

      [Service]
      ExecStart=/usr/local/bin/nvidia-setup-devices.sh

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd for nvidia-caps
  ansible.builtin.command: systemctl daemon-reload
  when: nvidia_dev_systemd_unit.changed or nvidia_dev_script.changed

- name: Enable nvidia-setup-devices service
  ansible.builtin.systemd_service:
    name: nvidia-setup-devices
    enabled: true

- name: reboot after initramfs, NVIDIA devices script or nvidia-drm-hold update
  reboot:
    post_reboot_delay: 10
  when: (nvidia_driver_module_file_result.changed or nvidia_dev_systemd_unit.changed or nvidia_dev_script.changed or nvidia_drm_hold_systemd_unit.changed or nvidia_drm_hold_script.changed) and not nvidia_driver_skip_reboot

- name: install NVIDIA container toolkit
  import_tasks: container-toolkit.yml
  tags: [ nvidia-container-toolkit ]