all:
  hosts:
    # Vagrant VM
    "192.168.56.43":
      ansible_user: vagrant
      ansible_ssh_private_key_file: .vagrant/machines/default/virtualbox/private_key
      ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      
      sunshine_server_name: dev-vagrant
      sunshine_nvidia_enable: false
      sunshine_compose_pull_images: never

      # No autoheal on dev VM: container is recreated on every deploy
      # (dev-docker-sunshine-to-vm force-recreate) and pulling the autoheal
      # image on a fresh VM fails the deploy (pull policy "never" above)
      sunshine_autoheal_enable: false
      sunshine_image_tag: local

      autostop_timeout_seconds: 3600 # 1h

      # Vagrant VM has no usable GPU: VirtualBox VMSVGA (vmwgfx) EGL is not
      # supported by modern Mesa. Load the vkms virtual GPU module so the
      # compositor can render with llvmpipe over GBM and Sunshine can capture
      # via linux-dmabuf (see start-labwc.sh software rendering fallback)
      # (variable name kept: _vgem suffix, module switched to vkms)
      sunshine_software_rendering_vgem: true

# Web UI access: Sunshine 2026+ CSRF requires explicit origin allowlist.
      # start-sunshine.sh allows localhost + container IPs automatically; add
      # the VM LAN IP here as it's unreachable from the container (NAT) while
      # host browsers reach the Web UI through it (port forwarding)
      sunshine_csrf_allowed_origins:
        - "https://192.168.56.43"

      sunshine_keyboard_layout: fr
      sunshine_keyboard_variant: azerty
      sunshine_keyboard_model: pc104
      sunshine_keyboard_options: terminate:ctrl_alt_bksp

      sunshine_web_username: sunshine
      
      # Password with special characters
      # echo -n '@!/:,?!*#'"'"'€`_\µ$="foo' | base64 | base64 -d
      # => @!/:,?!*#'€`_\µ$="foo
      sunshine_web_password_base64: QCEvOiw/ISojJ+KCrGBfXMK1JD0iZm9v
    
      # sunshine_keyboard_layout: fr
      # sunshine_keyboard_variant: mac,azerty
      # sunshine_keyboard_model: macbook78
      # sunshine_keyboard_options: ""

      sunshine_locale: fr_FR.UTF-8

      # Dev environment specifics
      # Vagrant VM has no GPU access. Sunshine default capture is wlr
      # (Wayland compositor capture) which works fine on the labwc stack.
      #
      # Legacy note for the former Xorg/XFCE stack: Sunshine defaulted to KMS
      # capture which crashed X11 in the VM + container for unknown reason;
      # forcing "capture = x11" was a workaround. No longer applicable on
      # the Wayland (labwc) stack.
      # Disable autostop on dev VM: inactivity shutdown kills the dev
      # environment during long debugging sessions
      autostop_enable: false

      sunshine_max_bitrate_kbps: "5000"

      # Debug mounts: bind mount local repo overlay directly in the container
      # so overlay changes (scripts, configs...) can be tested without
      # rebuilding the image. The local project is synced in the VM at
      # /vagrant (see Vagrantfile), hence /vagrant/<project/path> paths.
      # Ansible re-deploys the Compose with these mounts on every
      # "task dev-docker-sunshine-to-vm" / "task dev-ansible-config" run,
      # recreating the container when mounts change.
      #
      # Mount the whole overlay bin/ and conf/ trees: mounted files are read
      # from the local checkout at container start (config templates are
      # rendered at boot by start scripts)
      # Note: whole-tree mounts hide persistent configs bind mounted above
      # (eg. /cloudy/conf/labwc) - mount subdirectories instead if needed
      sunshine_extra_volumes:
        - "/vagrant/containers/sunshine/overlay/cloudy/bin:/cloudy/bin"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/cloudypad:/cloudy/conf/cloudypad"
        # conf/sunshine contains runtime-rendered files (sunshine.conf,
        # software-rendering.conf) written by start scripts: do NOT mount the
        # whole tree read-only, mount individual static files/dirs instead
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/sunshine/sunshine.conf.template:/cloudy/conf/sunshine/sunshine.conf.template"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/sunshine/apps.json:/cloudy/conf/sunshine/apps.json"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/sunshine/assets:/cloudy/conf/sunshine/assets"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/labwc-default:/cloudy/conf/labwc-default"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/waybar-default:/cloudy/conf/waybar-default"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/heroic-default:/cloudy/conf/heroic-default"
        - "/vagrant/containers/sunshine/overlay/cloudy/conf/supervisor:/cloudy/conf/supervisor"

      cloudypad_provider: "vagrant"
      